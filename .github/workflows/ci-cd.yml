name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Show PHP version
        run: |
          php -v
          composer --version

      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite

      - name: Run Laravel tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Show Node versions
        run: |
          node --version
          npm --version

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy Production
    needs: test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true

          script: |
            set -e

            PROJECT_DIR="/var/www/saheb-gharanieh"

            echo "========================================"
            echo "Starting production deployment"
            echo "========================================"

            cd "$PROJECT_DIR"

            echo "==> Current commit"
            git rev-parse --short HEAD

            echo "==> Fetch latest main"
            git fetch origin main

            echo "==> Reset to origin/main"
            git reset --hard origin/main

            echo "==> Verify commit"
            git rev-parse --short HEAD

            echo "==> Install PHP dependencies"
            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --no-progress \
              --optimize-autoloader

            echo "==> Install Node dependencies"
            npm ci

            echo "==> Build production assets"
            npm run build

            echo "==> Run database migrations"
            php artisan migrate --force

            echo "==> Ensure storage symlink"
            php artisan storage:link || true

            echo "==> Clear Laravel caches"
            php artisan optimize:clear

            echo "==> Build Laravel production cache"
            php artisan optimize

            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"

            echo "==> Deployed commit:"
            git rev-parse HEAD
