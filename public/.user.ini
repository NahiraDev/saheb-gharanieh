; PHP upload limits for the café panel.
;
; The image field offers 6 MB (App\Support\UploadLimit::WANTED_KILOBYTES). PHP's
; own defaults are 2M/8M, which is below that, and the panel refuses to promise
; more than PHP will take — so without this file the hint quietly drops to "۲".
;
; Both numbers sit deliberately above 6 MB:
;
;   upload_max_filesize  a photo between 6 and 8 MB is then refused by Laravel,
;                        with a message naming the real limit, instead of arriving
;                        broken and being reported as "failed to upload".
;   post_max_size        a body over this is discarded whole by PHP — token, text
;                        fields and all — leaving nothing to render an error from.
;                        Keeping it clear of upload_max_filesize means a single
;                        photo can never trip it.
;
; Read by the FastCGI/CGI SAPIs (nginx + php-fpm, apache + php-fpm) from the
; directory of the running script, which is this one. Apache with mod_php ignores
; it and reads public/.htaccess instead; `php artisan serve` ignores both — its
; limits come from the CLI php.ini. Changes take up to user_ini.cache_ttl
; (300s by default) to be picked up.
;
; nginx has a limit of its own that PHP cannot see: client_max_body_size, which
; defaults to 1M and answers 413 on its own. See the README.

upload_max_filesize = 8M
post_max_size = 12M
